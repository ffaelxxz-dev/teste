<body>

     <a href="apresentação.html" style="font-size: 20px;">Apresentação</a> |<br>

    <p style="font-size: 20px;">Entre em contato conosco para dúvidas, sugestões ou informações sobre nossos produtos e serviços. Estamos aqui para ajudar!</p>
    <p style="font-size: 20px;"><strong>Login:</strong></p>
    
    <form action="sucesso.html" method="GET">
    <label for="username" style="font-size: 20px;">Usuário:</label><br>
    <input type="text" id="username" name="username" style="font-size: 20px;" placeholder="Digite seu nome" required><br>
    
    <label for="email" style="font-size: 20px;">Email:</label><br>
    <input type="email" id="email" name="email" style="font-size: 20px;" placeholder="Digite seu email" required><br>
    
    <label for="problema" style="font-size: 20px;">Problema:</label><br>
    <input type="text" id="problema" name="problema" style="font-size: 20px;" placeholder="No que podemos ajudar?" required><br>

    <label for="mensagem" style="font-size: 20px;">Mensagem:</label><br>
    <input type="text" id="mensagem" name="mensagem" style="font-size: 20px;" placeholder="Deixe sua mensagem..." required><br><br>
    <button type="submit" style="font-size: 15px;">Enviar</button>
    <button type="reset" style="font-size: 15px;">Limpar</button>





</form>
